image: rocker/verse:4.3.2

stages:
  - check
  - test

variables:
  R_LIBS_USER: "$CI_PROJECT_DIR/ci/lib"

before_script:
  - Rscript -e 'install.packages(c("covr"), repos="https://cloud.r-project.org")'

cran-check:
  stage: check
  script:
    - Rscript -e 'devtools::check(document = FALSE, error_on = "warning")'
  artifacts:
    paths:
      - devtools-check.log
    expire_in: 1 week

test-coverage:
  stage: test
  script:
    - R -e 'cov <- covr::package_coverage(); covr::to_cobertura(cov)'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
  coverage: '/Coverage: \d+\.\d+/'

