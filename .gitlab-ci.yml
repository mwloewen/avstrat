# =============================================================================
# r-package-ci.yml — entry template for the reusable R-package CI/CD pipeline.
#
# It provides four report-only jobs (each reports pass/fail via a yellow
# warning icon on failure but never blocks the pipeline):
#   - pii-scan          (stage: security,         every push)
#   - r-check           (stage: r code review,            every push)
#   - r-coverage          (stage: test coverage,             every push)
#   - usgs-code-review  (stage: USGS Code Review, every push)
#
# Adding a new job later: add templates/jobs/<name>.yml here under `include:`
# and give it one of the stages below (or add a new stage).
# =============================================================================

include:
  - project: 'mloewen/code_review_cicd'
    ref: main
    file: '/jobs/pii-scan.yml'
  - project: 'mloewen/code_review_cicd'
    ref: main
    file: '/jobs/r-check.yml'
  - project: 'mloewen/code_review_cicd'
    ref: main
    file: '/jobs/r-coverage.yml'
  - project: 'mloewen/code_review_cicd'
    ref: main
    file: '/jobs/usgs-code-review.yml'

# Run the pipeline for tag pipelines and branch pushes.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# All jobs default to the CHS shared runners.
default:
  tags:
    - chs-shared

stages:
  - security
  - r code review
  - test coverage
  - USGS Code Review

variables:
  # CHS internal CRAN mirror.
  CRAN: "https://rpkg.chs.usgs.gov/prod-cran/latest"
